[package]
name = "chainmind"
version = "0.1.0"
edition = "2021"
description = "A language model that runs inside NEAR consensus"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
chainmind-engine = { path = "../engine" }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
chainmind-tools = { path = "../tools" }
